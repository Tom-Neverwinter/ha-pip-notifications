show:
  fields:
    camera:
      required: true
      selector:
        entity:
          domain: camera
    tvs:
      example: living_room
      selector:
        text:
          multiple: true
    name:
      example: Front door
      selector:
        text:
    location:
      example: Porch
      selector:
        text:
    analysis:
      selector:
        text:
          multiline: true
    ai_task_entity:
      selector:
        entity:
          domain: ai_task
    ai_prompt:
      selector:
        text:
          multiline: true
    duration:
      default: 5
      selector:
        number:
          min: 3
          max: 120
          unit_of_measurement: s

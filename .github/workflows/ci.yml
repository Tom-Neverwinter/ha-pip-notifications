name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch breakage from new Home Assistant releases
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest (HA's integration validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    # The HACS action refuses private repos; runs automatically once the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands # no logo in home-assistant/brands yet

  version:
    name: Versions in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'EOF'
          import json, os, re, sys
          ha = json.load(open("custom_components/pip_notifications/manifest.json"))["version"]
          apk = re.search(r'android:versionName="([^"]+)"', open("android/AndroidManifest.xml").read())[1]
          ref = os.environ.get("GITHUB_REF", "")
          tag = ref.removeprefix("refs/tags/v") if ref.startswith("refs/tags/v") else None
          print(f"manifest.json {ha} | AndroidManifest {apk} | tag {tag}")
          sys.exit(0 if ha == apk and tag in (None, ha) else "Versions out of sync")
          EOF

  ha-tests:
    name: HA integration tests (latest HA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.14 && uv pip install pytest-homeassistant-custom-component PyTurboJPEG
      - run: .venv/bin/python -c "import homeassistant.const as c; print('HA', c.__version__)"
      - run: .venv/bin/python -m pytest tests -v -p no:cacheprovider

  lint:
    name: ruff, bandit, shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uvx ruff@0.7.4 check custom_components tests
      - run: uvx ruff@0.7.4 format --check custom_components tests
      # Python 3.12: bandit crashes on 3.14 ASTs and then *skips the file* with exit 0.
      - run: |
          out=$(uvx --python 3.12 bandit@1.8.6 -r custom_components); echo "$out"
          echo "$out" | grep -q 'Files skipped (0)' || { echo 'bandit skipped files'; exit 1; }
      - run: uvx --from shellcheck-py@0.10.0.1 shellcheck android/build.sh .githooks/pre-commit

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --no-banner -v

  apk:
    name: Build APK (throwaway debug key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" > /dev/null
      - run: HAPIP_KEYSTORE="$RUNNER_TEMP/ci.keystore" bash android/build.sh
      - run: '"$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions android/build/ha-pip-notifications.apk'

  badges:
    name: Badges from real repo data
    # Shields.io can't read private repos, so build the badges here from GitHub's own data
    # (license detection, latest release) and the repo files, and publish them to the
    # `badges` branch that the README points to.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          license=$(gh api "repos/$GITHUB_REPOSITORY/license" --jq .license.spdx_id 2>/dev/null || echo "not detected")
          release=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || echo "none")
          ha=$(python3 -c "import json; print(json.load(open('hacs.json'))['homeassistant'])")
          sdk=$(python3 -c "import re; print(re.search(r'minSdkVersion=\"(\d+)\"', open('android/AndroidManifest.xml').read())[1])")
          android=$(python3 -c "print({26:'8.0',27:'8.1',28:'9',29:'10',30:'11',31:'12',32:'12L',33:'13',34:'14',35:'15'}.get($sdk, 'API $sdk'))")
          echo "license=$license release=$release ha=$ha android=$android (API $sdk)"
          esc() { python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1].replace('-', '--').replace('_', '__')))" "$1"; }
          mkdir -p out
          badge() { curl -fsSL "https://img.shields.io/badge/$(esc "$2")-$(esc "$3")-$4${5:+?logo=$5&logoColor=white}" -o "out/$1.svg"; }
          badge license License "$license" "$([ "$license" = "not detected" ] && echo red || echo yellow)"
          badge release Release "$release" blue
          badge homeassistant "Home Assistant" "$ha+" 41BDF5 homeassistant
          badge android "Android TV" "$android+" 3DDC84 android
          printf '{"license":"%s","release":"%s","homeassistant":"%s","android":"%s","source_commit":"%s"}\n' \
            "$license" "$release" "$ha" "$android" "$GITHUB_SHA" > out/badges.json
          cd out && git init -q -b badges && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Badges for $GITHUB_SHA"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git" badges
